<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Geometry Dash List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 id="title">Geometry Dash List</h1>
    <nav>
      <button id="tab-list" class="active">List</button>
      <button id="tab-players">Players</button>
    </nav>
  </header>

  <main id="view-list">
    <aside id="level-list"></aside>
    <section id="level-detail"></section>
  </main>

  <main id="view-players" hidden>
    <table id="players-table">
      <thead>
        <tr><th>#</th><th>Player</th><th>Points</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </main>

  <script src="script.js"></script>
</body>
</html>
